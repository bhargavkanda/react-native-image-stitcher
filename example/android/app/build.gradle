apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rnimagestitcherexample"
    defaultConfig {
        applicationId "com.rnimagestitcherexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // ── Host OpenCV-reuse demo (consumer) ────────────────────────
        // Builds app/src/main/cpp/opencv_self_test.cpp, which reuses the
        // SAME custom OpenCV bundled by react-native-image-stitcher —
        // including cv::Stitcher — via OpenCV's own find_package.
        //
        // The library exposes the path to its vendored OpenCV Android SDK
        // through `rootProject.ext.rnisOpenCVDir`.  We resolve it robustly:
        // prefer the ext property; if the library configures AFTER this
        // module we fall back to deriving it from the autolinked library
        // project's dir (evaluation-order independent).
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DOpenCV_DIR=${resolveRnisOpenCVDir()}",
                          // Match the library's STL so the cv::* C++ ABI
                          // (libc++ __ndk1) lines up at link/runtime.
                          "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
        // Force the Metro port to 8082 (project-wide convention; 8081
        // is held by Tug's Expo dev server).  The React Native Gradle
        // plugin's `configureDevServerLocation` is supposed to bake
        // `reactNativeDevServerPort` from gradle.properties into the
        // `react_native_dev_server_port` resource — but in our RN
        // 0.84 + AGP setup it gets shadowed by the default "8081"
        // somewhere in finalizeDsl ordering.  Setting the resource
        // explicitly here wins because `defaultConfig.resValue`
        // applied directly in app/build.gradle is the
        // highest-priority source AGP honours.
        resValue "integer", "react_native_dev_server_port", "8082"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // F8.4-Android-c forcing fix: pin Metro port at buildType
            // layer (highest-priority resValue overlay over both our
            // defaultConfig and the RN plugin's finalizeDsl
            // injection).  Empirically the RN 0.84 Gradle plugin's
            // `configureDevServerLocation` was being re-run with the
            // hardcoded `DEFAULT_DEV_SERVER_PORT = "8081"` during the
            // run-android full assemble, overriding the 8082 value
            // it correctly picked up during `generateDebugResValues`.
            // Setting the resource here side-steps the race entirely.
            resValue "integer", "react_native_dev_server_port", "8082"
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Compile + link the host OpenCV-reuse consumer (opencv_self_test.cpp).
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    // The library AAR already packages libopencv_java4.so into the APK.
    // We link against it (IMPORTED SHARED via find_package) but must NOT
    // re-package a second copy from the vendored SDK.  pickFirsts keeps the
    // single AAR-provided .so if any duplicate is ever seen at merge time.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libopencv_java4.so', '**/libc++_shared.so']
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * Resolve the bundled OpenCV Android SDK CMake-config dir
 * (…/sdk/native/jni, holding OpenCVConfig.cmake) that the consumer's
 * find_package(OpenCV) needs.
 *
 * Primary source: rootProject.ext.rnisOpenCVDir, published by the
 * react-native-image-stitcher library's android/build.gradle.  If this
 * module happens to be configured before the library, that ext isn't set
 * yet — so we fall back to deriving the path from the autolinked library
 * Gradle project's projectDir (evaluation-order independent).
 */
def resolveRnisOpenCVDir() {
    if (rootProject.ext.has('rnisOpenCVDir')) {
        return rootProject.ext.rnisOpenCVDir
    }
    def libProject = rootProject.findProject(':react-native-image-stitcher')
    if (libProject != null) {
        // libProject.projectDir == <pkg>/android ; SDK lives under vendor/.
        return file("${libProject.projectDir}/vendor/OpenCV-android-sdk/sdk/native/jni").absolutePath
    }
    throw new GradleException(
        "Could not locate the react-native-image-stitcher OpenCV SDK: neither " +
        "rootProject.ext.rnisOpenCVDir nor the ':react-native-image-stitcher' " +
        "project is available.  Is the library installed + autolinked?")
}
