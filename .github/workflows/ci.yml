# SPDX-License-Identifier: Apache-2.0
#
# ci.yml — runs on every push + PR.  Lightweight check that catches
# the cheapest class of bugs (TS type errors, broken jest tests)
# before they merge.  Native builds (xcodebuild / gradle) are NOT
# part of this workflow — they're slow + require platform runners,
# and the existing manual on-device verification before merge is
# the canonical native gate.  Adding native builds here is a v0.10.x
# follow-up if a cheap-enough Android runner becomes available.
#
# v0.10.0 audit finding #12A — closes the "tests are non-negotiable
# but CI doesn't enforce them" gap.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push lands on the same branch.
# Saves minutes on fast iteration; doesn't affect main pushes
# (which always run to completion).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pin to the Node version the example app builds with.
          # See feedback_binary_release_packaging.md + recent
          # session notes: the dev workflow uses nvm + Node 20 for
          # Metro / RN builds (Node 17 lacks os.availableParallelism
          # which @react-native/metro-config requires).
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `--ignore-scripts` skips the postinstall fetcher for the
        # OpenCV binaries.  CI doesn't need them — we're not
        # building native code here.  Saves ~70 MB of download +
        # 30s of unpack on every run.
        run: npm ci --ignore-scripts

      - name: TypeScript type check (lib + tests)
        # `tsc --noEmit` against the root tsconfig.json validates
        # the lib's TS surface AND test files (per
        # tsconfig.test.json's include).  Fails on any type error.
        run: npx tsc --noEmit

      - name: Jest unit tests
        # The lib's existing tests under src/camera/__tests__/
        # cover PanoramaSettings bridge round-trips + initial-
        # settings construction.  As v0.10.x adds more test
        # coverage (audit findings #9A C++ tests, #11A Android
        # JUnit), those will land in this same job via different
        # commands.
        run: npm test --silent

      - name: Build dist/
        # Confirm the published-package contents would compile
        # cleanly.  Catches the class of bug we hit during v0.7.0
        # where dist/ went stale relative to src/.
        run: npm run build
