# SPDX-License-Identifier: Apache-2.0
#
# ci.yml — runs on every push + PR.  Lightweight check that catches
# the cheapest class of bugs (TS type errors, broken jest tests)
# before they merge.  Native builds (xcodebuild / gradle) are NOT
# part of this workflow — they're slow + require platform runners,
# and the existing manual on-device verification before merge is
# the canonical native gate.  Adding native builds here is a v0.10.x
# follow-up if a cheap-enough Android runner becomes available.
#
# v0.10.0 audit finding #12A — closes the "tests are non-negotiable
# but CI doesn't enforce them" gap.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push lands on the same branch.
# Saves minutes on fast iteration; doesn't affect main pushes
# (which always run to completion).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pin to the Node version the example app builds with.
          # See feedback_binary_release_packaging.md + recent
          # session notes: the dev workflow uses nvm + Node 20 for
          # Metro / RN builds (Node 17 lacks os.availableParallelism
          # which @react-native/metro-config requires).
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `--ignore-scripts` skips ALL npm scripts (preinstall /
        # install / postinstall / prepare).  Today's only relevant
        # script is `postinstall`, which fetches the OpenCV
        # binaries (~70 MB) — not needed for tsc / jest.  If a
        # future preinstall or prepare script becomes load-bearing
        # for CI, revisit this flag.
        run: npm ci --ignore-scripts

      - name: TypeScript type check — src + tests
        # Root `tsconfig.json` includes `src/**`, which covers the
        # test files under `src/camera/__tests__/` transitively.
        # `tsconfig.test.json` adds `jest.config.js` + `jest.mocks/`
        # — those are checked separately in the next step.
        run: npx tsc --noEmit

      - name: TypeScript type check — jest config + mocks
        # `tsconfig.test.json` adds `jest.config.js` + `jest.mocks/`
        # to the include set.  Catches drift in the test
        # infrastructure that the root config doesn't see.
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Jest unit tests
        # The lib's existing tests under src/camera/__tests__/
        # cover PanoramaSettings bridge round-trips + initial-
        # settings construction.  As v0.10.x adds more test
        # coverage (audit findings #9A C++ tests, #11A Android
        # JUnit), those land in this same job via different commands.
        #
        # `-- --ci` (passed THROUGH npm to jest, not consumed by
        # npm) disables snapshot creation (only allows matching)
        # + makes the runner deterministic.  Standard CI practice.
        # `--silent` (also passed to jest) suppresses test-side
        # console.log noise.
        run: npm test -- --ci --silent

      - name: Build dist/
        # Confirm the published-package contents would compile
        # cleanly.  Catches the class of bug we hit during v0.7.0
        # where dist/ went stale relative to src/.  `build` now cleans
        # dist/ first, so stale/archived artifacts can't linger.
        run: npm run build

      - name: Typecheck the example app against the built SDK
        # The src-only typecheck above never sees the example app, so an
        # SDK change that archives/renames a PUBLIC API the example still
        # imports (e.g. the v0.15 `useFrameProcessor` removal) slips
        # through to a runtime `undefined is not a function`.  The example
        # imports the SDK from the built `dist/` (file:.. link), so the
        # previous step must run first.  `--ignore-scripts` skips the
        # SDK's heavy OpenCV postinstall (irrelevant to tsc); patch-package
        # is applied explicitly because the example depends on its patches.
        working-directory: example
        run: |
          npm ci --ignore-scripts
          npx patch-package
          npx tsc --noEmit

  # ────────────────────────────────────────────────────────────────────
  # native-cpp — the shared C++ Google Test suite.
  #
  # A SEPARATE job, not a step appended to typecheck-and-test: that job
  # finishes in ~0.5 s and this one installs OpenCV and compiles C++.
  # Bolting them together makes the fast feedback loop slow for everyone.
  #
  # ⚠ libopencv-dev is NOT optional here, and the job must never be
  # "fixed" by dropping it.  Every OpenCV-dependent case lives inside an
  # `if(OpenCV_FOUND)` branch; with no host OpenCV the build succeeds,
  # ctest prints "0 tests failed out of 115" and exits 0, and nine cases
  # have silently vanished.  scripts/run-cpp-tests.sh now refuses to run
  # in that state — that refusal is the point of this job.
  # ────────────────────────────────────────────────────────────────────
  native-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install a host OpenCV
        # Ubuntu's libopencv-dev ships the full module set, including
        # imgcodecs — the OpenCV-dependent runners call imread/imwrite,
        # which a core+imgproc-only build cannot satisfy.
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev cmake ninja-build
          pkg-config --modversion opencv4

      - name: Build + run the C++ tests
        # The script configures each project into its own build dir,
        # asserts a minimum discovered-case count per project, and only
        # then runs ctest.  A project that discovers fewer cases than its
        # floor fails the job even if every case it did discover passed.
        run: scripts/run-cpp-tests.sh

  # ────────────────────────────────────────────────────────────────────
  # android — the JNI shim compiles, and the JUnit suite runs.
  #
  # There is no root settings.gradle: the library module is reachable
  # only through the example app's Gradle build, which autolinks it as
  # `:react-native-image-stitcher`.  So this job installs the ROOT
  # node_modules (React Native's own Gradle plugin and prefabs come from
  # there) and the example's, then drives gradlew from example/android.
  #
  # ⚠ `npm ci` runs WITHOUT --ignore-scripts at the root, unlike every
  # other job here.  The postinstall fetches the vendored OpenCV Android
  # SDK (~70 MB) into android/src/main/jniLibs/, which is gitignored and
  # which android/src/main/cpp/CMakeLists.txt requires.  Adding
  # --ignore-scripts here makes the native build fail on a missing
  # OpenCV include dir.
  # ────────────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The JUnit floor. A `testDebugUnitTest` task with no test sources is
    # BUILD SUCCESSFUL and runs zero tests — indistinguishable from a
    # passing suite in the job summary. Raise this the moment test
    # sources land under android/src/test; never lower it to go green.
    env:
      MIN_JUNIT_TESTS: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        # AGP 8.x hard-requires JDK 17.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (root, WITH postinstall)
        run: npm ci

      - name: Install dependencies (example)
        working-directory: example
        run: |
          npm ci --ignore-scripts
          npx patch-package

      - name: Compile the JNI shim
        # externalNativeBuildDebug, NOT assembleDebug: assemble reports
        # SUCCESS without relinking when it judges the .so up to date,
        # which is how a stale library ships.
        working-directory: example/android
        run: ./gradlew :react-native-image-stitcher:externalNativeBuildDebug

      - name: Show the built libraries
        run: find android/build -name '*.so' -print

      - name: Run the JUnit suite
        working-directory: example/android
        run: ./gradlew :react-native-image-stitcher:testDebugUnitTest

      - name: Assert the JUnit suite actually ran
        run: |
          set -euo pipefail
          DIR=android/build/test-results/testDebugUnitTest
          if [ ! -d "$DIR" ]; then
            COUNT=0
          else
            COUNT=$(grep -ho 'tests="[0-9]*"' "$DIR"/*.xml 2>/dev/null \
                    | sed 's/[^0-9]//g' | paste -sd+ - | bc || echo 0)
            COUNT=${COUNT:-0}
          fi
          echo "JUnit cases run: $COUNT (floor $MIN_JUNIT_TESTS)"
          if [ "$COUNT" -lt "$MIN_JUNIT_TESTS" ]; then
            echo "::error::JUnit suite ran $COUNT cases, expected >= $MIN_JUNIT_TESTS." \
                 "Cases went missing silently — find out which before touching the floor."
            exit 1
          fi
